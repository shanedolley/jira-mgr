<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>jira-mgr</title>
  <defs>
    <linearGradient id="tile" x1="0.25" y1="1" x2="0.75" y2="0">
      <stop offset="0" stop-color="#0C66E4"/>
      <stop offset="1" stop-color="#1D7AFC"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#091E42" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS tile: 824 px square on the 1024 px canvas, corner radius 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#lift)"/>
  <!-- three stacked chevrons, the upper two fading -->
  <g fill="none" stroke="#fff" stroke-width="100" stroke-linecap="round" stroke-linejoin="round">
    <path d="M322 420 L512 270 L702 420" opacity="0.5"/>
    <path d="M322 584 L512 434 L702 584" opacity="0.78"/>
    <path d="M322 748 L512 598 L702 748"/>
  </g>
</svg>
