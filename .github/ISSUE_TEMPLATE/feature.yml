name: Feature
description: Something jira-mgr should do.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What success looks like. Acceptance criteria if you have them.
    validations:
      required: true
